# Weekly updates for the three kinds of dependency this repository has. Minor and patch updates of one kind come as one
# pull request; a major update comes alone. Security updates are separate pull requests (Dependabot's default).
version: 2
updates:
  # The root `package.json` and the workspaces (client, server, tools) share one lock file.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # The versions of the actions the workflow uses (pinned by commit, with the version in a comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # The base image of the Dockerfile (pinned by digest).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
